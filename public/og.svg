<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="halo" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#10131c"/>
      <stop offset="55%" stop-color="#0a0c12"/>
      <stop offset="100%" stop-color="#06070a"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="emerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- soft emerald halo, top center -->
  <ellipse cx="600" cy="120" rx="520" ry="220" fill="url(#emerald)"/>

  <!-- hairline card -->
  <rect x="60" y="60" width="1080" height="510" rx="28" fill="#0b0c11" stroke="#ffffff" stroke-opacity="0.05"/>
  <rect x="60" y="60" width="1080" height="510" rx="28" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <!-- specular top rim -->
  <rect x="90" y="61" width="1020" height="1.5" rx="0.75" fill="#ffffff" fill-opacity="0.07"/>

  <!-- wordmark -->
  <text x="120" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#ededef" letter-spacing="6">UI \ [99]</text>

  <!-- headline -->
  <text x="120" y="330" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="84" font-weight="700" fill="#ffffff" letter-spacing="-2.5">The Design System.</text>

  <!-- subline -->
  <text x="120" y="392" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" fill="#92929b" letter-spacing="-0.3">92 copy-anywhere React primitives · obsidian velvet · WCAG 2.2 audited</text>

  <!-- stat pill -->
  <rect x="120" y="452" width="436" height="52" rx="26" fill="#0e0e14" stroke="#ffffff" stroke-opacity="0.05"/>
  <text x="152" y="485" font-family="'JetBrains Mono','Fira Code',monospace" font-size="21" fill="#c6c6cd">92 components · WCAG-verified · MIT</text>

  <!-- CLI chip bottom -->
  <text x="120" y="560" font-family="'JetBrains Mono','Fira Code',monospace" font-size="22" fill="#63636d">npx @99/ui add button</text>
</svg>
