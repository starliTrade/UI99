name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Token adherence gate (no hardcoded surface/ink hexes)
        run: bun run tokens:gate

      - name: Tests (behavioral + axe + contrast)
        run: bun run test

      - name: Registry validation (schema + catalog + a11y metadata)
        run: |
          bun run registry:build
          bun run registry:validate

      - name: Kit build (ESM/CJS/d.ts/CSS + npm pack dry-run)
        run: bun run lib:build && cd dist-kit && npm pack --dry-run

      - name: Publish-readiness audit (manifest fields + files whitelist)
        run: node scripts/audit-package.mjs
